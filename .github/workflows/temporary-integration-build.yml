name: Temporary Performance + Monochrome Build

on:
  push:
    branches:
      - temp/performance-monochrome-integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-combined-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build combined debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out temporary integration branch
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Build combined debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Upload combined APK
        uses: actions/upload-artifact@v4
        with:
          name: spatialflow-performance-monochrome-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
